<!doctype html>
<!-- Página de la versión web: trunk compila apps/desktop a WebAssembly y la app dibuja en el canvas -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: la página ocupa toda la pantalla del iPhone y env(safe-area-inset-*)
         dice cuánto tapan la barra de estado, las esquinas y la barra de inicio -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LogicSM</title>
    <!-- wasm-opt -O4 solo en release: el .wasm más rápido. Se le dicen las funciones de
         wasm que Rust ya usa por defecto; sin eso, wasm-opt rechaza memory.fill y otras -->
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="logicsm"
      data-wasm-opt="4"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
    <!-- PWA: se instala desde el navegador (Agregar a la pantalla de inicio) y abre sin internet.
         copy-file deja los archivos sin hash, con el nombre que espera el manifiesto -->
    <link data-trunk rel="copy-file" href="../../assets/logo.png" />
    <link data-trunk rel="copy-file" href="web/logo-192.png" />
    <link data-trunk rel="copy-file" href="web/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="web/sw.js" />
    <link rel="icon" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f8f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d201e" media="(prefers-color-scheme: dark)" />
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* En el celular, el alto que queda sin las barras del navegador */
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #f8f8f5;
      }
      body {
        /* La app dibuja solo dentro de la zona segura (eframe mide el canvas, no el body):
           nada queda bajo la barra de estado ni lo cortan las esquinas del iPhone */
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      /* Las franjas de la zona segura con el fondo del tema que arranca (el del sistema) */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1d201e;
        }
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Los gestos (arrastrar, pellizcar) van a la app y no hacen zoom en la página */
        touch-action: none;
        /* Encima del aviso de carga: lo tapa en cuanto la app dibuja el primer cuadro */
        position: relative;
        z-index: 1;
      }
      .cargando {
        position: fixed;
        inset: 0;
        margin: 0;
        display: grid;
        place-items: center;
        font: 15px system-ui, sans-serif;
        color: #7f827e;
      }
    </style>
  </head>
  <body>
    <canvas id="logicsm"></canvas>
    <p class="cargando">Cargando LogicSM…</p>
    <noscript class="cargando">LogicSM necesita JavaScript para funcionar.</noscript>
  </body>
</html>
