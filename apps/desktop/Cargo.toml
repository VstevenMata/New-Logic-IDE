[package]
name = "logicsm"
description = "LogicSM: diseña, visualiza y simula circuitos digitales"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false }
eframe = "0.37.0"
logicsm-core.workspace = true
logicsm-sim.workspace = true
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
