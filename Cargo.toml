[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VstevenMata/logicsm"

[workspace.dependencies]
logicsm-core = { path = "crates/logicsm-core" }
logicsm-sim = { path = "crates/logicsm-sim" }

# Lo más rápido posible (escritorio y web): optimiza todo el programa junto.
# Compila más lento, pero la simulación y el dibujo van más fluidos.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

# En desarrollo (`cargo run`, `trunk serve`) las dependencias (egui, wgpu...) van
# optimizadas; si no, la app se arrastra
[profile.dev.package."*"]
opt-level = 2
