# Al fusionar a main: si la versión de Cargo.toml no tiene tag todavía, compila LogicSM para
# cada sistema, crea el tag vX.Y.Z y publica el release con los nombres que descargan
# instalar.sh e instalar.ps1, y publica la versión web en GitHub Pages. Si la versión no
# cambió, no hace nada. "Run workflow" (a mano) solo vuelve a publicar la web.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Dos merges seguidos no publican el mismo release dos veces
concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.leer.outputs.tag }}
      nuevo: ${{ steps.leer.outputs.nuevo }}
    steps:
      - uses: actions/checkout@v4
      - id: leer
        run: |
          # El primer "version =" de Cargo.toml es el de [workspace.package]
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "nuevo=false" >> "$GITHUB_OUTPUT"
            echo "$tag ya existe; no se publica nada"
          else
            echo "nuevo=true" >> "$GITHUB_OUTPUT"
          fi

  compilar:
    needs: version
    if: needs.version.outputs.nuevo == 'true' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 para que el binario corra también en distros con glibc más vieja
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archivo: logicsm-linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archivo: logicsm-linux-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, archivo: logicsm-macos-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, archivo: logicsm-macos-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archivo: logicsm-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p logicsm --target ${{ matrix.target }}
      - name: Renombrar
        shell: bash
        run: |
          origen=target/${{ matrix.target }}/release/logicsm
          if [ -f "$origen.exe" ]; then origen="$origen.exe"; fi
          cp "$origen" ${{ matrix.archivo }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archivo }}
          path: ${{ matrix.archivo }}

  publicar:
    needs: [version, compilar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Crea el tag en el commit del merge y el release con los ejecutables
      - run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LogicSM $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}

  # La app en el navegador: https://<usuario>.github.io/<repositorio>/
  # Requiere Settings → Pages → Source: GitHub Actions
  web:
    needs: version
    if: needs.version.outputs.nuevo == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Instalar trunk
        run: curl -sSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar xz
      # Trunk.toml dice qué página compilar y que quede en dist/
      - run: ./trunk build --release --locked --public-url "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: desplegar
        uses: actions/deploy-pages@v4
