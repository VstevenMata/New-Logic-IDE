name: Reporte de bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué pasó?
      description: Describe el problema y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: codigo
    attributes:
      label: Código mínimo que lo reproduce
      description: El circuito `.SA` más pequeño posible que muestra el problema.
      render: cpp
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir el archivo...
        2. Presionar ▶...
        3. Activar la entrada...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: so
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
